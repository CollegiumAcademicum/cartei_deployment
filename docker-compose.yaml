# Runs on pod0 next to docker-compose.db.yaml. Postgres is reached by container
# name over cartei_default (created by cartei-db.service); Caddy (/tank/caddy)
# reverse-proxies to cartei_app_1:8000 over systemd-caddy.
services:
  migrate:
    image: ghcr.io/collegiumacademicum/cartei-db:latest
    env_file: .env
    restart: on-failure

  app:
    image: ghcr.io/collegiumacademicum/cartei-web:latest
    env_file: .env
    volumes:
      - ./certs:/app/certs:ro,z
    networks:
      - default
      - caddy
    depends_on:
      - migrate
    restart: unless-stopped

networks:
  default:
    name: cartei_default
    external: true
  caddy:
    name: systemd-caddy
    external: true
